# GARVIS_AUTH_TOKEN    = 32-byte hex opaque token (only enforced when GARVIS_AUTH_DISABLED=false)
# GARVIS_PASSWORD      = password used by /.netlify/functions/garvis-auth POST endpoint
#                        (only meaningful when GARVIS_AUTH_DISABLED=false)
