# ─── Garvis Operations Tab Phase 3 — agent feedback (PR #9) ───────────────
# Closes the self-improvement loop: Marc rates agent outputs from the session
# detail drawer, this endpoint routes feedback to the agent's memstore +
# triggers Apollos failure-mode-trigger / reference-curate downstream.
[[redirects]]
  from   = "/api/agent-feedback"
  to     = "/.netlify/functions/agent-feedback"
  status = 200

[[redirects]]
  from   = "/api/agent-feedback-history"
  to     = "/.netlify/functions/agent-feedback-history"
  status = 200

